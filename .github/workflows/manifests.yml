name: manifests

# Render every Helm chart and kustomization in the repo and validate the
# output against Kubernetes and CRD schemas, so a broken manifest never
# reaches Argo CD.

on:
  pull_request:
    paths:
      - "platform/**"
      - "policies/**"
      - "workloads/**"
      - "scripts/validate-manifests.sh"
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "policies/**"
      - "workloads/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render and validate
        run: ./scripts/validate-manifests.sh
