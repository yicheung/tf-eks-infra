# Supply chain: workloads run only digest-pinned images from our registry, and
# those images must carry a valid keyless cosign signature from this repo's
# CI workflow (GitHub OIDC identity, recorded in Rekor).
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-source
  annotations:
    policies.kyverno.io/title: Images from the platform registry, pinned by digest
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
spec:
  validationActions: {{ toYaml .Values.validationActions | nindent 4 }}
  {{- include "policies.podMatch" . | nindent 2 }}
  variables:
    {{- include "policies.allContainersVar" . | nindent 4 }}
    - name: allowedPrefix
      expression: "'{{ required "registry.host is required" .Values.registry.host }}/{{ .Values.registry.prefix }}/'"
  validations:
    - expression: >-
        variables.containers.all(c, c.image.startsWith(variables.allowedPrefix))
      messageExpression: >-
        'Images must come from ' + variables.allowedPrefix
    - expression: >-
        variables.containers.all(c, c.image.contains('@sha256:'))
      message: Images must be pinned by digest (image@sha256:...), not by tag.
---
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify keyless cosign signatures
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
spec:
  validationActions: {{ toYaml .Values.validationActions | nindent 4 }}
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 15
  {{- include "policies.podMatch" . | nindent 2 }}
  matchImageReferences:
    - glob: "{{ .Values.registry.host }}/{{ .Values.registry.prefix }}/*"
  {{- with .Values.imageCredentialProviders }}
  credentials:
    providers: {{ toYaml . | nindent 6 }}
  {{- end }}
  validationConfigurations:
    required: true
    verifyDigest: true
    mutateDigest: false
  attestors:
    - name: ci
      cosign:
        keyless:
          identities:
            - issuer: {{ .Values.signer.issuer | quote }}
              subjectRegExp: {{ required "signer.subjectRegExp is required" .Values.signer.subjectRegExp | quote }}
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.ci])).all(e, e > 0)
      message: Image signature not found or not signed by the platform CI workflow.
