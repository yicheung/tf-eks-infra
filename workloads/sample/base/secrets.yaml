# Pulled from the cloud secret manager by External Secrets Operator.
# On EKS the remote key is "<cluster-name>/sample-app" in AWS Secrets Manager
# (ESO's IAM role can read only "<cluster-name>/*", cluster name =
# <project>-<environment>). Create it with, e.g. for project "parallel":
#   aws secretsmanager create-secret --name parallel-dev/sample-app \
#     --secret-string '{"GREETING":"hello from secrets manager"}'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sample-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cloud-secrets
  target:
    name: sample-app
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: REPLACED_BY_OVERLAY
