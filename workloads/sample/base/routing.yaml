# Exposed only through the platform's shared Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sample-app
spec:
  parentRefs:
    - name: shared
      namespace: gateway-system
  # Set a hostname under your domain once TLS is configured, e.g.
  # hostnames: ["sample.dev.example.com"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sample-app
          port: 80
