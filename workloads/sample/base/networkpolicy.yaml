# Kyverno also generates default-deny + DNS for every tenant namespace; these
# are declared here too so the app is self-describing and safe even if the
# generator is not running. Cloud-specific "allow from the Gateway" lives in
# the overlay (the Gateway's data plane identity differs per cloud).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sample-app-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sample-app
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sample-app-dns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sample-app
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
