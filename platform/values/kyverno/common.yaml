# HA: the admission controller sits in the request path for every Pod.
admissionController:
  replicas: 3
  serviceAccount:
    name: kyverno-admission-controller
  serviceMonitor:
    enabled: true

cleanupController:
  replicas: 2
  serviceMonitor:
    enabled: true

reportsController:
  replicas: 2
  serviceMonitor:
    enabled: true

features:
  policyExceptions:
    enabled: true
    namespace: kyverno

# kube-system and the kyverno namespace are excluded from webhooks by the
# chart defaults; keep it that way.

# The tenant-default-deny GeneratingPolicy creates NetworkPolicies.
backgroundController:
  replicas: 2
  serviceMonitor:
    enabled: true
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: [networking.k8s.io]
          resources: [networkpolicies]
          verbs: [create, update, patch, delete, get, list, watch]

# Dashboard ConfigMap for the Grafana sidecar.
grafana:
  enabled: true
